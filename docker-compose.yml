version: '3.8'

services:
  web:
    build: .
    container_name: medicine-ai-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - MIN_CONFIDENCE_THRESHOLD=${MIN_CONFIDENCE_THRESHOLD:-0.5}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-10}
      - RXNAV_API_TIMEOUT=${RXNAV_API_TIMEOUT:-10}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - uploaded_images:/app/data/raw_images
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  uploaded_images:
